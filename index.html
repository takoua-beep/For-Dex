<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cute Adventure - Starter Game</title>
<link rel="stylesheet" href="style.css" />

<!-- Phaser 3, loaded from a CDN. No install/build step needed. -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>

  <!-- Phaser will render the game canvas inside this div -->
  <div id="game-container"></div>

  <!--
    On-screen D-Pad controls (works on both mobile and desktop with mouse).
    Arrow keys on the keyboard also work automatically (handled in game.js).
    Feel free to restyle these buttons in style.css.
  -->
  <div id="dpad">
    <button id="btn-up"    class="dpad-btn dpad-up">▲</button>
    <button id="btn-left"  class="dpad-btn dpad-left">◀</button>
    <button id="btn-right" class="dpad-btn dpad-right">▶</button>
    <button id="btn-down"  class="dpad-btn dpad-down">▼</button>
  </div>

  <!-- Our game code (config, scenes, input handling) -->
  <script src="game.js"></script>
</body>
</html>
